    # PHP パッケージインストール
    - name: Install PHP and extensions
      ansible.builtin.dnf:
        name:
          - php
          - php-pdo
          - php-mysqlnd
          - php-fpm
          - php-mbstring
          - php-gd
        state: present
      notify: Restart Apache

    # PHP-FPM 自動起動
    - name: Start and enable PHP-FPM service
      systemd:
        name: php-fpm
        state: started
        enabled: yes

    # タイムゾーン設定
    - name: Set timezone in php.ini
      ansible.builtin.lineinfile:
        path: /etc/php.ini 
        regexp: '^;?date.timezone\s*='
        line: 'date.timezone = Asia/Tokyo'
        state: present
        backup: yes
      notify: Restart PHP-FPM

    # PHP バージョン非表示化
    - name: Disable expose_php in php.ini
      ansible.builtin.lineinfile:
        path: /etc/php.ini
        regexp: '^;?expose_php\s*='
        line: 'expose_php = off'
        state: present
        backup: yes
      notify: Restart PHP-FPM

    # 画像アップロード上限を引き上げ (デフォルト2Mだとスマホ写真等が弾かれるため)
    - name: Set upload_max_filesize in php.ini
      ansible.builtin.lineinfile:
        path: /etc/php.ini
        regexp: '^;?upload_max_filesize\s*='
        line: 'upload_max_filesize = 64M'
        state: present
        backup: yes
      notify: Restart PHP-FPM

    - name: Set post_max_size in php.ini
      ansible.builtin.lineinfile:
        path: /etc/php.ini
        regexp: '^;?post_max_size\s*='
        line: 'post_max_size = 64M'
        state: present
        backup: yes
      notify: Restart PHP-FPM

    # Apache テストページ内に PHP インフォメーションファイル追加
    - name: Deploy phpinfo file to Apache document root
      ansible.builtin.copy: 
        dest: /var/www/html/info.php
        content: "<?php\nphpinfo();\n"
        owner: apache
        group: apache
        mode: '0644'
